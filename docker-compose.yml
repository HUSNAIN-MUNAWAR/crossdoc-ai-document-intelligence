services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: crossdoc
      POSTGRES_PASSWORD: crossdoc
      POSTGRES_DB: crossdoc
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crossdoc -d crossdoc"]
      interval: 10s
      timeout: 5s
      retries: 5
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["9000:9000", "9001:9001"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 20s
      timeout: 5s
      retries: 5
  backend:
    build: ./backend
    env_file: .env.example
    environment:
      DATABASE_URL: postgresql+psycopg://crossdoc:crossdoc@postgres:5432/crossdoc
      REDIS_URL: redis://redis:6379/0
      CROSSDOC_DEMO_OCR: "false"
    volumes:
      - ./.storage:/app/.storage
      - ./sample_data:/app/sample_data
    ports: ["8000:8000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 20s
      timeout: 5s
      retries: 5
  worker:
    build: ./backend
    command: celery -A app.workers.celery_app worker --loglevel=INFO
    env_file: .env.example
    environment:
      REDIS_URL: redis://redis:6379/0
      CROSSDOC_DEMO_OCR: "false"
    depends_on:
      redis: { condition: service_healthy }
  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    ports: ["3000:3000"]
    depends_on:
      backend: { condition: service_healthy }
  flower:
    image: mher/flower:2.0
    command: celery --broker=redis://redis:6379/0 flower
    ports: ["5555:5555"]
    depends_on:
      redis: { condition: service_healthy }
